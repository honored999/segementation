# Values copied from reference/nnUNetPlans.json configurations["2d"].
dataset_name: Dataset501_StrokeLesion
plans_name: nnUNetPlans
patch_size: [512, 512]
batch_size: 12
spacing: [0.4892368018627167, 0.4892368018627167]
normalization: ZScoreNormalization
use_mask_for_norm: false
network:
  class_name: PlainConvUNet2D
  input_channels: 1
  output_channels: 2
  n_stages: 8
  features_per_stage: [32, 64, 128, 256, 512, 512, 512, 512]
  conv_bias: true
  norm: InstanceNorm2d
  norm_eps: 1.0e-5
  norm_affine: true
  nonlinearity: LeakyReLU
  negative_slope: 0.01 # PyTorch nn.LeakyReLU default; absent from the supplied plans.
  inplace: true
  dropout: null
  batch_dice: true
loss:
  dice_weight: 1.0
  cross_entropy_weight: 1.0
  dice_smooth: 1.0e-5
  include_background: false
  deep_supervision_weights: [1.0] # Expand explicitly after source verification.
sampling:
  foreground_probability: 0.0
augmentation:
  horizontal_flip_probability: 0.0
  vertical_flip_probability: 0.0
  intensity_scale_range: [1.0, 1.0]
smoke_run:
  smoke_run_only: true
  train_cases: 1
  validation_cases: 1
  epochs: 1
  optimizer: SGD
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0
